server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Cache-Control
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
jwt.secret=${JWT_SECRET:K7gNU3sdo4LER9GjjmemsGerhHwJh4aQHKjjjZVwzVXo=}
################ Discovery Server #####################
# Do NOT use lb:// here unless discovery-server registers itself in Eureka.
spring.cloud.gateway.routes[0].id=discovery-server
spring.cloud.gateway.routes[0].uri=${DISCOVERY_SERVER_URI:http://localhost:8761}
spring.cloud.gateway.routes[0].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[0].filters[0]=SetPath=/
################ Game Service #####################
spring.cloud.gateway.routes[1].id=game
spring.cloud.gateway.routes[1].uri=lb://game
spring.cloud.gateway.routes[1].predicates[0]=Path=/games/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter
