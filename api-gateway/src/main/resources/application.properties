server.port=8080


spring.application.name=api-gateway
spring.cloud.discovery.enabled=true

eureka.client.serviceUrl.defaultZone  = http://localhost:8761/eureka

# In some cases, it is preferable for Eureka to advertise the IP addresses of services rather than the hostname.
# This can be done by setting eureka.instance.preferIpAddress to true and,
# when the application registers with eureka, it uses its IP address rather than its hostname.
eureka.client.instance.preferIpAddress = true


# The logging level can be one of: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF.
# The root logger can be configured using logging.level.root.
logging.level.root= INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator= INFO
logging.level.org.springframework.cloud.gateway= TRACE

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Cache-Control
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true


jwt.secret=${JWT_SECRET:K7gNU3sdo4LER9GjjmemsGerhHwJh4aQHKjjjZVwzVXo=}


################ Discovery Server #####################
spring.cloud.gateway.routes[0].id=discovery-server
spring.cloud.gateway.routes[0].uri=http://localhost:8761
spring.cloud.gateway.routes[0].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[0].filters[0]=SetPath=/

################ Game Service (port 8082) #####################
spring.cloud.gateway.routes[1].id=game-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/games/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

################ Bonus Service (port 8084) #####################
# FIX: was incorrectly pointing to 8083 (ledger). Bonus runs on 8084.
spring.cloud.gateway.routes[2].id=bonus-service
spring.cloud.gateway.routes[2].uri=http://localhost:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bonuses/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

################ Auth Service (port 8090) #####################
spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=http://localhost:8090
spring.cloud.gateway.routes[3].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

################ Profile Service (port 8086) #####################
spring.cloud.gateway.routes[4].id=profile-service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/profiles/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

################ Wallet Service (port 8085) #####################
spring.cloud.gateway.routes[5].id=wallet-service
spring.cloud.gateway.routes[5].uri=http://localhost:8085
spring.cloud.gateway.routes[5].predicates[0]=Path=/wallet/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter
