spring.application.name=auth-service
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/authservice_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

logging.level.com.casino=INFO

# Include the exception message in the JSON error body so the frontend can show
# meaningful warnings (e.g. "Account is suspended.") instead of generic codes.
server.error.include-message=always

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true
eureka.instance.preferIpAddress=true

# Base64-encoded 256-bit key for HS256 (override in production)
jwt.secret=K7gNU3sdo4LER9GjjmemsGerhHwJh4aQHKjjjZVwzVXo=

# --- Async (Kafka) -----------------------------------------------------------
# auth-service is a *producer* only. It publishes AccountStatusChanged events to
# topic "auth.account-status" whenever an admin changes an account's status.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Fail fast if the broker is unreachable so the admin's HTTP request isn't blocked.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.retries=0
events.account-status.topic=auth.account-status
