server.port=8086

spring.application.name=profile-service

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true
eureka.instance.preferIpAddress=true

spring.datasource.url=jdbc:postgresql://localhost:5432/profileservice_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.com=INFO

# Springdoc / Swagger UI (defaults; do not set swagger-ui.path to a .html file — use /swagger-ui and open .../index.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.packages-to-scan=com.casino.profileservice.users.controller

# Before POST /profiles, profile-service calls GET {auth}/auth/accounts/{accountId} with the same Bearer token.
auth.service.base-url=http://localhost:8090
auth.verification.enabled=true
