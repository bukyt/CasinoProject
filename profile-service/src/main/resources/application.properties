server.port=8086

spring.application.name=profile-service

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.instance.preferIpAddress=true
eureka.instance.preferIpAddress=true

spring.datasource.url=jdbc:postgresql://localhost:5432/profileservice_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.com=INFO

# Useful while debugging 500s locally (see actual exception message in JSON error body)
server.error.include-message=always

# After changing PK to Integer: if you still had UUID/string ids in Postgres, run:
# DROP TABLE IF EXISTS player_profiles CASCADE;
# then restart so Hibernate recreates the table and seed data gets ids 1, 2.

# Springdoc / Swagger UI (defaults; do not set swagger-ui.path to a .html file — use /swagger-ui and open .../index.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.packages-to-scan=com.casino.profileservice.users.controller

# Before POST /profiles, profile-service calls GET {auth}/auth/accounts/{accountId} with the same Bearer token.
auth.service.base-url=http://localhost:8090
auth.verification.enabled=true

# --- Async (Kafka) -----------------------------------------------------------
# profile-service is a *consumer* of AccountStatusChanged events published by
# auth-service on the "auth.account-status" topic. When an admin suspends an
# account, this service marks the matching profile as INACTIVE — and vice versa.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=profile-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Deserialize blindly into our local record, ignoring the producer's __TypeId__ header.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.casino.event.AccountStatusChanged
spring.kafka.consumer.properties.spring.json.trusted.packages=com.casino.event
events.account-status.topic=auth.account-status
